name: CI

on:
  push:
    branches:
      - commit1

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Start server in background
        run: |
          npm start &
      - name: Wait for server to start
        run: sleep 10
      - name: Run tests
        run: npm test
